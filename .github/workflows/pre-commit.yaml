name: pre-commit

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - uses: pre-commit/action@v3.0.0
      with:
        # Audit our cumulative changes, without reformatting the inherited research code.
        extra_args: --from-ref 465eef4406ad0cff675b36bd46f37f28b1736ff9 --to-ref HEAD --show-diff-on-failure
    - name: Launcher failure regression tests (no GPU dependencies)
      run: python -m unittest discover -s tests/orion -p 'test_*.py' -v
    - name: Shell syntax
      run: |
        bash -n orion/site.env
        for script in orion/scripts/*.sh orion/slurm/*.sbatch; do
          bash -n "$script"
        done
